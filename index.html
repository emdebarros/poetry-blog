<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emma's Poetry</title>
  <meta
    name="description"
    content="A personal poetry space where I share my original poems, reflections, and favourite poems that help me breathe, understand, and grow."
  />

  <!-- Fonts to match the vibe of the screenshot -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #fff7f1;
      --fg: #3e2d28;
      --muted: #a48779;
      --card: #fffaf5;
      --border: #edd9cd;
      --accent: #c96a45;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: "Karla", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 1.1rem 1.25rem;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .brand h1 {
      font-family: "Fraunces", ui-serif, Georgia, "Times New Roman", serif;
      font-size: 1.5rem;
      letter-spacing: 0.04em;
      margin: 0;
    }

    .brand small {
      color: var(--muted);
      font-size: 0.9rem;
    }

    nav.tabs {
      display: flex;
      gap: 1.25rem;
      margin-left: auto;
      font-size: 0.95rem;
    }

    nav.tabs a {
      position: relative;
      padding-bottom: 0.1rem;
      color: var(--muted);
      white-space: nowrap;
    }

    nav.tabs a:hover {
      color: var(--fg);
    }

    /* Simple underline for hover/active vibes */
    nav.tabs a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -0.1rem;
      width: 0;
      height: 1.5px;
      background: var(--accent);
      transition: width 0.18s ease-out;
    }

    nav.tabs a:hover::after {
      width: 100%;
    }

    main.grid {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 2.25rem;
      align-items: start;
      padding: 2.5rem 1.25rem 2.75rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Intro page: no sidebar, centered content like in the screenshot */
    body.intro-mode main.grid {
      grid-template-columns: minmax(0, 1fr);
      max-width: 780px;
    }

    body.intro-mode aside.panel {
      display: none;
    }

    @media (max-width: 900px) {
      main.grid {
        grid-template-columns: 1fr;
        gap: 1.75rem;
        padding: 1.75rem 1rem 2.25rem;
      }
    }

    .panel {
      border-radius: 1rem;
      padding: 1rem;
      border: 1px solid var(--border);
      background: var(--card);
    }

    .search {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      padding: 0.55rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fffdf9;
    }

    .search input {
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--fg);
      width: 100%;
      font-family: inherit;
      font-size: 0.92rem;
    }

    .search svg {
      opacity: 0.65;
    }

    .list {
      margin-top: 0.75rem;
    }

    .item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
      align-items: baseline;
      padding: 0.65rem 0.5rem;
      border-radius: 0.75rem;
      cursor: pointer;
    }

    .item:hover {
      background: #fef2e9;
    }

    .item-title {
      font-weight: 600;
      font-size: 0.97rem;
    }

    .item-meta {
      color: var(--muted);
      font-size: 0.8rem;
    }

    article {
      border-radius: 1rem;
      padding: 2rem 1.75rem 2.25rem;
      background: var(--card);
      border: 1px solid var(--border);
    }

    @media (max-width: 700px) {
      article {
        padding: 1.5rem 1.25rem 2rem;
      }
    }

    /* Intro quote styled like the screenshot */
    #intro-quote-slot[hidden] {
      display: none;
    }

    .intro-quote-card {
      border-left: 3px solid var(--accent);
      padding-left: 1.5rem;
      margin-bottom: 2rem;
      max-width: 42rem;
    }

    .intro-quote-text {
      font-family: "Fraunces", ui-serif, Georgia, "Times New Roman", serif;
      font-size: 1.1rem;
      font-style: italic;
      letter-spacing: 0.01em;
    }

    .intro-quote-author {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .poem-title {
      font-family: "Fraunces", ui-serif, Georgia, "Times New Roman", serif;
      font-size: clamp(1.5rem, 2.4vw, 2rem);
      margin: 0 0 0.4rem 0;
      letter-spacing: 0.03em;
    }

    .meta {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.3rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .poem {
      font-family: "Fraunces", ui-serif, Georgia, "Times New Roman", serif;
      white-space: pre-wrap;
      letter-spacing: 0.01em;
      font-size: 1.02rem;
    }

    .intro-body {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      margin-top: 0.25rem;
      max-width: 46rem;
    }

    .intro-body p {
      margin: 0;
    }

    .intro-body p:last-child {
      font-style: italic;
      color: var(--accent);
    }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 2.25rem 1rem 2.75rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap brand" role="banner">
      <h1>Emma's Poetry</h1>
      <small>my poetry space</small>
      <span style="margin-left: auto"></span>
      <nav class="tabs" aria-label="Sections">
        <a href="#/intro" title="Introduction">Intro</a>
        <a href="#/analyses" title="Poem analyses">Analysis</a>
        <a href="#/originals" title="My originals">Originals</a>
      </nav>
    </div>
  </header>

  <main class="grid" id="app">
    <!-- Sidebar (hidden on Intro) -->
    <aside class="panel" aria-label="Sidebar">
      <div class="sidebar-main">
        <div class="search" role="search">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M21 21l-4.35-4.35m1.6-4.65a6.95 6.95 0 11-13.9 0 6.95 6.95 0 0113.9 0z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
          <input
            id="q"
            type="search"
            placeholder="Search… (title or text)"
            autocomplete="off"
          />
        </div>
        <div class="list" id="list" role="list"></div>
      </div>
    </aside>

    <!-- Main content -->
    <section>
      <article aria-live="polite" aria-busy="false">
        <!-- Intro quote gets rendered here on the intro page -->
        <div id="intro-quote-slot" hidden></div>

        <h2 class="poem-title" id="title">Welcome</h2>
        <div class="meta" id="meta"></div>
        <div class="poem" id="poem">Loading poems…</div>
      </article>
    </section>
  </main>

  <footer>
    <span>
      All original work © <span id="year"></span> Emma De Barros.
      Cannot be reproduced without permission.
    </span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
