<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emma's Poetry</title>
  <meta
    name="description"
    content="A personal poetry space where I share my original poems, reflections, and favourite poems that help me breathe, understand, and grow."
  />

  <!-- Fonts to match the vibe of the screenshot -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #fff7f1;
      --fg: #3e2d28;
      --muted: #a48779;
      --card: #fffaf5;
      --border: #edd9cd;
      --accent: #c96a45;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: "Karla", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 1.1rem 1.25rem;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .brand h1 {
      font-family: "Fraunces", ui-serif, Georgia, "Times New Roman", serif;
      font-size: 1.5rem;
      letter-spacing: 0.04em;
      margin: 0;
    }

    .brand small {
      color: var(--muted);
      font-size: 0.9rem;
    }

    nav.tabs {
      display: flex;
      gap: 1.25rem;
      margin-left: auto;
      font-size: 0.95rem;
    }

    nav.tabs a {
      position: relative;
      padding-bottom: 0.1rem;
      color: var(--muted);
      white-space: nowrap;
    }

    nav.tabs a:hover {
      color: var(--fg);
    }

    /* Simple underline for hover/active vibes */
    nav.tabs a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -0.1rem;
      width: 0;
      height: 1.5px;
      background: var(--accent);
      transition: width 0.18s ease-out;
    }

    nav.tabs a:hover::after {
      width: 100%;
    }

    main.grid {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 2.25rem;
      align-items: start;
      padding: 2.5rem 1.25rem 2.75rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Intro page: no sidebar, centered content like in the screenshot */
    body.intro-mode main.grid {
      grid-template-columns: minmax(0, 1fr);
      max-width: 780px;
    }

    body.intro-mode aside.panel {
      display: none;
    }

    @media (max-width: 900px) {
      main.grid {
        grid-template-columns: 1fr;
        gap: 1.75rem;
        padding: 1.75rem 1rem 2.25rem;
      }
    }

    .panel {
      border-radius: 1rem;
      padding: 1rem;
      border: 1px solid var(--border);
      background: var(--card);
    }

    .search {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      padding: 0.55rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fffdf9;
    }

    .search input {
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--fg);
      width: 100%;
      font-family: inherit;
      font-size: 0.92rem;
    }

    .search svg {
      opacity: 0.65;
    }

    .list {
      margin-top: 0.75rem;
    }

    .item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
      align-items: baseline;
      padding: 0.65rem 0.5rem;
      border-radius: 0.75rem;
      cursor: pointer;
