<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emma's Poetry</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#intro" class="nav-brand">Emma's Poetry</a>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#intro" class="nav-link" data-tab="intro">Intro</a>
                </li>
                <li class="nav-item">
                    <a href="#analysis" class="nav-link" data-tab="analysis">Analysis</a>
                </li>
                <li class="nav-item">
                    <a href="#originals" class="nav-link active" data-tab="originals">Originals</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Intro Tab -->
        <div id="intro" class="tab-content">
            <div class="container">
                <div class="intro-content fade-in">
                    <!-- Quote Section -->
                    <blockquote class="intro-quote">
                        <p class="poetry-text quote-text" id="intro-quote-text"></p>
                        <footer class="quote-author" id="intro-quote-author"></footer>
                    </blockquote>

                    <!-- Personal Message -->
                    <div class="intro-message">
                        <div id="intro-body" class="intro-body-text"></div>
                        <p class="poetry-text infinite-adore" id="intro-infinite-adore"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Analysis Tab -->
        <div id="analysis" class="tab-content" style="display: none;">
            <div class="container">
                <div class="fade-in">
                    <h1 class="page-title">Poetry Analysis</h1>
                    <p class="page-subtitle">Exploring the poems I love most, with notes and reflections</p>
                    
                    <div id="analysis-content" class="accordion-container">
                        <!-- Analysis content will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Originals Tab -->
        <div id="originals" class="tab-content" style="display: none;">
            <div class="container">
                <div class="fade-in">
                    <h1 class="page-title">Original Work</h1>
                    <p class="page-subtitle">My poetry, my voice, my heart</p>
                    
                    <div id="originals-content" class="accordion-container">
                        <!-- Originals content will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>All original work © 2025 Emma De Barros. Cannot be reproduced without permission.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
