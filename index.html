<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Poetry Space</title>
  <meta
    name="description"
    content="A quiet personal space where poetry is therapy. While ‘My Infinite Adore’ holds these walls, I hope to speak to her here—to meet again."
  />
  <style>
    :root {
      --bg: #ffffff;
      --fg: #0f172a;
      --muted: #475569;
      --card: #f8fafc;
      --border: #e2e8f0;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f1a;
        --fg: #e5e7eb;
        --muted: #94a3b8;
        --card: #0f172a;
        --border: #1f2937;
        --accent: #60a5fa;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
        Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: saturate(180%) blur(8px);
      background: color-mix(in oklab, var(--bg) 85%, transparent);
      border-bottom: 1px solid var(--border);
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .brand h1 {
      font-size: 1.25rem;
      letter-spacing: 0.02em;
      margin: 0;
    }

    .brand small {
      color: var(--muted);
    }

    nav.tabs {
      display: flex;
      gap: 0.5rem;
      margin-left: auto;
    }

    nav.tabs a {
      display: inline-block;
      padding: 0.45rem 0.75rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      border-radius: 0.5rem;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.25rem;
      align-items: start;
      padding: 1.25rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 1rem;
      padding: 0.75rem;
    }

    .search {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      background: var(--bg);
    }

    .search input {
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--fg);
      width: 100%;
    }

    .list {
      margin-top: 0.75rem;
    }

    .item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
      align-items: baseline;
      padding: 0.75rem;
      border-radius: 0.75rem;
      cursor: pointer;
    }

    .item:hover {
      background: color-mix(in oklab, var(--bg) 90%, var(--card));
    }

    .item-title {
      font-weight: 600;
    }

    .item-meta {
      color: var(--muted);
      font-size: 0.85rem;
    }

    article {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 1rem;
      padding: 1.25rem;
    }

    .poem-title {
      font-size: clamp(1.3rem, 2.6vw, 2rem);
      margin: 0 0 0.25rem 0;
      letter-spacing: 0.01em;
    }

    .meta {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .poem {
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
      white-space: pre-wrap;
      letter-spacing: 0.01em;
      font-size: 1.06rem;
    }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 3rem 1rem;
    }

    /* Intro quote in the sidebar spot */
    #intro-quote-slot {
      display: none; /* shown only in intro-mode */
    }

    body.intro-mode .sidebar-main {
      display: none;
    }

    body.intro-mode #intro-quote-slot {
      display: block;
    }

    .intro-quote-card {
      position: relative;
      padding: 1.25rem 1.3rem 1rem;
      border-radius: 1rem;
      border: 1px solid var(--border);
      background:
        radial-gradient(circle at top left, color-mix(in oklab, var(--accent) 14%, transparent) 0, transparent 55%),
        radial-gradient(circle at bottom right, color-mix(in oklab, var(--accent) 10%, transparent) 0, transparent 55%),
        var(--bg);
      overflow: hidden;
    }

    .intro-quote-card::before {
      content: "“";
      position: absolute;
      top: -2.1rem;
      left: -0.2rem;
      font-size: 4.5rem;
      line-height: 1;
      opacity: 0.08;
      pointer-events: none;
    }

    .intro-quote-text {
      font-size: 0.98rem;
      line-height: 1.7;
      letter-spacing: 0.01em;
    }

    .intro-quote-author {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--muted);
    }

    .intro-body {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      margin-top: 0.5rem;
    }

    .intro-body p {
      margin: 0;
      color: var(--fg);
      max-width: 60ch;
    }

    .intro-body p + p {
      opacity: 0.92;
    }

    .intro-body p:last-child {
      opacity: 0.9;
    }

    /* — Mobile refinements — */
    @media (max-width: 700px) {
      .wrap {
        padding: 0.75rem;
      }

      nav.tabs {
        width: 100%;
        order: 3;
        overflow-x: auto;
        padding-bottom: 0.25rem;
        margin-left: 0;
      }

      nav.tabs a {
        flex: 0 0 auto;
      }

      .grid {
        padding: 0.75rem;
      }

      .panel,
      article {
        padding: 1rem;
      }

      .poem {
        font-size: 1rem;
        line-height: 1.7;
      }

      .brand h1 {
        font-size: 1.05rem;
      }

      .brand small {
        font-size: 0.9rem;
      }

      .search {
        gap: 0.4rem;
      }

      .item {
        padding: 0.65rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap brand" role="banner">
      <h1>My Infinite Adore</h1>
      <small>my poetry space</small>
      <span style="margin-left: auto"></span>
      <nav class="tabs" aria-label="Sections">
        <a href="#/intro" title="Introduction">Intro</a>
        <a href="#/analyses" title="Poem analyses">Analyses</a>
        <a href="#/originals" title="My originals">Originals</a>
      </nav>
    </div>
  </header>

  <main class="grid" id="app">
    <aside class="panel" aria-label="Sidebar">
      <!-- Intro-only quote lives here -->
      <div id="intro-quote-slot"></div>

      <!-- Normal sidebar content (hidden on intro) -->
      <div class="sidebar-main">
        <div class="search" role="search">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M21 21l-4.35-4.35m1.6-4.65a6.95 6.95 0 11-13.9 0 6.95 6.95 0 0113.9 0z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
          <input
            id="q"
            type="search"
            placeholder="Search… (title or text)"
            autocomplete="off"
          />
        </div>
        <div class="list" id="list" role="list"></div>
      </div>
    </aside>

    <section>
      <article aria-live="polite" aria-busy="false">
        <h2 class="poem-title" id="title">Welcome</h2>
        <div class="meta" id="meta"></div>
        <div class="poem" id="poem">Loading poems…</div>
      </article>
    </section>
  </main>

  <footer>
    <span>
      © <span id="year"></span> · Em De Barros — All poems are my original work.
      No reproduction without permission.
    </span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
